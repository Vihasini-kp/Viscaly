
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Viscaly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e9f5ff, #dceeff, #f4faff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(40, 100, 160, 0.12);
        }

        .welcome-panel {
            background: linear-gradient(145deg, #1769d2, #36b6e9);
            padding: 65px 50px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .welcome-panel::before,
        .welcome-panel::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
        }

        .welcome-panel::before {
            width: 330px;
            height: 330px;
            right: -120px;
            top: -100px;
        }

        .welcome-panel::after {
            width: 250px;
            height: 250px;
            left: -100px;
            bottom: -100px;
        }

        .brand {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }

        .brand span {
            color: #bcecff;
        }

        .welcome-content {
            position: relative;
            z-index: 1;
        }

        .welcome-content h1 {
            font-size: 39px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .welcome-content p {
            font-size: 15px;
            line-height: 1.8;
            color: #e5f5ff;
            max-width: 350px;
        }

        .welcome-footer {
            font-size: 12px;
            color: #e5f5ff;
            position: relative;
            z-index: 1;
        }

        .form-panel {
            padding: 65px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-panel h2 {
            font-size: 30px;
            font-weight: 800;
            color: #172c48;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8290a3;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-label {
            color: #34445b;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            height: 49px;
            border: 1px solid #e1e9f2;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #3188e8;
        }

        .login-btn {
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2478dd, #35a9e5);
            color: white;
            font-weight: 700;
            font-size: 15px;
            margin-top: 8px;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(36,120,221,0.25);
        }

        .register-link {
            text-align: center;
            color: #8390a2;
            font-size: 14px;
            margin-top: 25px;
        }

        .register-link a {
            color: #2478dd;
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            font-size: 13px;
            border-radius: 9px;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                padding: 35px;
                min-height: 240px;
            }

            .welcome-content h1 {
                font-size: 27px;
            }

            .welcome-footer {
                margin-top: 25px;
            }

            .form-panel {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="welcome-panel">

        <div class="brand">viscaly<span>.</span></div>

        <div class="welcome-content">
            <h1>Take control of your financial future.</h1>

            <p>
                Track your expenses, manage your budgets and
                build smarter financial habits with Viscaly.
            </p>
        </div>

        <div class="welcome-footer">
            Smart Finance. Clear Future.
        </div>

    </div>

    <div class="form-panel">

        <h2>Welcome back!</h2>

        <p class="subtitle">Sign in to continue to your account.</p>

        <div th:if="${success}" class="alert alert-success"
             th:text="${success}"></div>

        <div th:if="${error}" class="alert alert-danger"
             th:text="${error}"></div>

        <form th:action="@{/login}" method="post">

            <label class="form-label" for="email">Email address</label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label class="form-label" for="password">Password</label>

            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <button type="submit" class="login-btn w-100">
                Sign In
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a th:href="@{/register}">Create account</a>
        </div>

    </div>

</div>

</body>
</html>
