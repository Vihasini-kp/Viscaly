
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Viscaly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e9f5ff, #dceeff, #f4faff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 1000px;
            min-height: 650px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(40, 100, 160, 0.12);
        }

        .welcome-panel {
            background: linear-gradient(145deg, #1769d2, #36b6e9);
            padding: 65px 50px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .brand {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand span {
            color: #bcecff;
        }

        .welcome-content h1 {
            font-size: 39px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .welcome-content p {
            font-size: 15px;
            line-height: 1.8;
            color: #e5f5ff;
            max-width: 350px;
        }

        .welcome-footer {
            font-size: 12px;
            color: #e5f5ff;
        }

        .form-panel {
            padding: 48px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-panel h2 {
            font-size: 30px;
            font-weight: 800;
            color: #172c48;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8290a3;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            color: #34445b;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .form-control {
            height: 46px;
            border: 1px solid #e1e9f2;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #3188e8;
        }

        .register-btn {
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2478dd, #35a9e5);
            color: white;
            font-weight: 700;
            font-size: 15px;
            margin-top: 8px;
            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(36,120,221,0.25);
        }

        .login-link {
            text-align: center;
            color: #8390a2;
            font-size: 14px;
            margin-top: 22px;
        }

        .login-link a {
            color: #2478dd;
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            font-size: 13px;
            border-radius: 9px;
        }

        @media (max-width: 768px) {
            .register-wrapper {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                padding: 35px;
                min-height: 230px;
            }

            .welcome-content h1 {
                font-size: 27px;
            }

            .form-panel {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="welcome-panel">
        <div class="brand">viscaly<span>.</span></div>

        <div class="welcome-content">
            <h1>Your journey to smarter money management starts here.</h1>
            <p>
                Create your personal account and bring all your
                financial activities together in one place.
            </p>
        </div>

        <div class="welcome-footer">
            Smart Finance. Clear Future.
        </div>
    </div>

    <div class="form-panel">

        <h2>Create account</h2>
        <p class="subtitle">Join Viscaly and manage your finances smarter.</p>

        <div th:if="${error}" class="alert alert-danger"
             th:text="${error}"></div>

        <form th:action="@{/register}" method="post">

            <label class="form-label" for="name">Full name</label>
            <input type="text"
                   class="form-control"
                   id="name"
                   name="name"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   maxlength="100"
                   required>

            <label class="form-label" for="email">Email address</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label class="form-label" for="password">Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Minimum 8 characters"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <label class="form-label" for="confirmPassword">
                Confirm password
            </label>
            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Re-enter your password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit" class="register-btn w-100">
                Create My Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </div>

    </div>
</div>

</body>
</html>
